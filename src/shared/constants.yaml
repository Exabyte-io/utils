# https://physics.nist.gov/cuu/Constants/ (CODATA 2022)
coefficients:
  EV_TO_RY: 0.0734986444  # 1 / 13.605693122990
  BOHR_TO_ANGSTROM: 0.529177210544
  ANGSTROM_TO_BOHR: 1.8897261259077822 # 1 / 0.529177210544
  EV_A_TO_RY_BOHR: 0.0388938075966032  # 0.529177210544 / 13.605693122990

tolerance:
  # in crystal coordinates
  length: 0.01
  lengthAngstrom: 0.001
  pointsDistance: 0.001

units:
  bohr: "bohr"
  angstrom: "angstrom"
  degree: "degree"
  radian: "radian"
  alat: "alat"

# Coordinates units for a material's basis.
ATOMIC_COORD_UNITS:
  crystal: "crystal"
  cartesian: "cartesian"

# Only 3 digits will be considered for lattice and basis params for hashing
HASH_TOLERANCE: 3
